<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Focus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #1f1d1a;
    --muted: #6f6a62;
    --line: #e4e0d8;
    --accent: #d9534f;
    --track: #efe9df;
    --done: #4f9d69;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161514;
      --card: #201f1d;
      --text: #f1eee8;
      --muted: #a39d93;
      --line: #34322e;
      --track: #2c2a27;
    }
  }
  body.short { --accent: #3f8fbf; }
  body.long  { --accent: #4f9d69; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    padding: max(32px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    transition: background .3s;
    -webkit-tap-highlight-color: transparent;
  }
  main { width: 100%; max-width: 420px; }
  .card {
    background: var(--card);
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .modes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 20px; }
  .modes button {
    border: 0; background: transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .modes button.active { background: var(--accent); color: #fff; }

  .ring { position: relative; width: 100%; max-width: 240px; aspect-ratio: 1; margin: 0 auto; }
  .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; display: block; }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .track { stroke: var(--track); }
  .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s; }
  .ring .center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 0 15%;
  }
  .time { font-size: clamp(32px, 14vw, 52px); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .current { font-size: 14px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
  .controls button {
    font: inherit; font-weight: 600; border-radius: 12px; padding: 10px 22px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text);
  }
  .controls .primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 110px; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 12px; }

  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; display: flex; justify-content: space-between; }
  form { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type=text] {
    flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  form button { font: inherit; border: 0; border-radius: 10px; padding: 0 14px; background: var(--text); color: var(--card); cursor: pointer; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer;
    border: 1px solid transparent;
  }
  li.selected { border-color: var(--accent); }
  li.done .label { text-decoration: line-through; color: var(--muted); }
  li .label { flex: 1; overflow-wrap: anywhere; }
  li .pips { color: var(--accent); font-size: 12px; letter-spacing: 2px; }
  li input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--done); cursor: pointer; }
  li .del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; opacity: 0; }
  li:hover .del { opacity: 1; }
  @media (hover: none) { li .del { opacity: 1; } }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 8px; }

  .stats { display: flex; gap: 12px; }
  .stat { flex: 1; text-align: center; }
  .stat b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="modes">
      <button data-mode="focus" class="active">Focus</button>
      <button data-mode="short">Short break</button>
      <button data-mode="long">Long break</button>
    </div>
    <div class="ring">
      <svg viewBox="0 0 240 240">
        <circle class="track" cx="120" cy="120" r="108"/>
        <circle class="bar" cx="120" cy="120" r="108"/>
      </svg>
      <div class="center">
        <div class="time" id="time">25:00</div>
        <div class="current" id="current">Pick a task below</div>
      </div>
    </div>
    <div class="controls">
      <button class="primary" id="start">Start</button>
      <button id="reset">Reset</button>
      <button id="skip" title="Skip to next session">Skip</button>
    </div>
    <div class="hint">Space to start or pause · R to reset</div>
  </section>

  <section class="card">
    <h2>Tasks</h2>
    <form id="add">
      <input type="text" id="newTask" placeholder="What are you working on?" autocomplete="off">
      <button>Add</button>
    </form>
    <ul id="tasks"></ul>
  </section>

  <section class="card">
    <h2>Today</h2>
    <div class="stats">
      <div class="stat"><b id="sessions">0</b><span>focus sessions</span></div>
      <div class="stat"><b id="minutes">0</b><span>minutes focused</span></div>
      <div class="stat"><b id="finished">0</b><span>tasks done</span></div>
    </div>
  </section>
</main>

<script>
const DURATIONS = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
const LABELS = { focus: 'Focus', short: 'Short break', long: 'Long break' };
const STORE_KEY = 'focus-timer-v1';
const today = () => new Date().toISOString().slice(0, 10);

// ---------- persistence ----------
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && s.tasks) {
      if (s.day !== today()) { s.day = today(); s.sessions = 0; s.minutes = 0; s.tasks = s.tasks.filter(t => !t.done); }
      return s;
    }
  } catch {}
  return { day: today(), tasks: [], selected: null, sessions: 0, minutes: 0 };
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
}
const state = load();

// ---------- timer ----------
let mode = 'focus';
let remaining = DURATIONS.focus;
let endAt = null;      // timestamp when running
let tick = null;
let focusCount = 0;    // focus sessions since last long break

const $ = id => document.getElementById(id);
const bar = document.querySelector('.ring .bar');
const CIRC = 2 * Math.PI * 108;
bar.style.strokeDasharray = CIRC;

function fmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
}

function renderTimer() {
  const left = endAt ? (endAt - Date.now()) / 1000 : remaining;
  $('time').textContent = fmt(left);
  bar.style.strokeDashoffset = CIRC * (left / DURATIONS[mode]);
  document.title = (endAt ? fmt(left) + ' · ' : '') + LABELS[mode];
  $('start').textContent = endAt ? 'Pause' : (remaining < DURATIONS[mode] ? 'Resume' : 'Start');
  const t = state.tasks.find(t => t.id === state.selected);
  $('current').textContent = mode !== 'focus' ? 'Take a breather' : t ? t.text : 'Pick a task below';
}

function setMode(m) {
  pause();
  mode = m;
  remaining = DURATIONS[m];
  document.body.className = m === 'focus' ? '' : m;
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  renderTimer();
}

function start() {
  ensureAudio();
  endAt = Date.now() + remaining * 1000;
  tick = setInterval(() => {
    if (Date.now() >= endAt) finish(); else renderTimer();
  }, 250);
  renderTimer();
}

function pause() {
  if (!endAt) return;
  remaining = Math.max(0, (endAt - Date.now()) / 1000);
  endAt = null;
  clearInterval(tick);
  renderTimer();
}

function finish(skipped = false) {
  endAt = null;
  clearInterval(tick);
  if (!skipped) chime();
  if (mode === 'focus') {
    if (!skipped) {
      state.sessions++;
      state.minutes += DURATIONS.focus / 60;
      const t = state.tasks.find(t => t.id === state.selected);
      if (t) t.pomos = (t.pomos || 0) + 1;
      save();
      renderTasks();
    }
    focusCount++;
    setMode(focusCount % 4 === 0 ? 'long' : 'short');
  } else {
    setMode('focus');
  }
  if (!skipped && window.Notification?.permission === 'granted') {
    new Notification(mode === 'focus' ? 'Break over — back to it!' : 'Nice work! Time for a break.');
  }
}

// ---------- sound ----------
let audio;
function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === 'suspended') audio.resume();
  if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
}
function chime() {
  if (!audio) return;
  [523.25, 659.25, 783.99].forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    const t = audio.currentTime + i * 0.18;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.25, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + 1.3);
  });
}

// ---------- tasks ----------
function renderTasks() {
  const ul = $('tasks');
  ul.innerHTML = '';
  if (!state.tasks.length) ul.innerHTML = '<li class="empty">No tasks yet. Add one above.</li>';
  for (const t of state.tasks) {
    const li = document.createElement('li');
    li.className = (t.done ? 'done ' : '') + (t.id === state.selected ? 'selected' : '');
    const cb = Object.assign(document.createElement('input'), { type: 'checkbox', checked: !!t.done });
    cb.onclick = e => { e.stopPropagation(); t.done = cb.checked; save(); renderTasks(); };
    const label = Object.assign(document.createElement('span'), { className: 'label', textContent: t.text });
    const pips = Object.assign(document.createElement('span'), { className: 'pips', textContent: '●'.repeat(t.pomos || 0) });
    const del = Object.assign(document.createElement('button'), { className: 'del', textContent: '×', title: 'Delete' });
    del.onclick = e => {
      e.stopPropagation();
      state.tasks = state.tasks.filter(x => x !== t);
      if (state.selected === t.id) state.selected = null;
      save(); renderTasks();
    };
    li.onclick = () => { state.selected = t.id; save(); renderTasks(); };
    li.append(cb, label, pips, del);
    ul.append(li);
  }
  $('sessions').textContent = state.sessions;
  $('minutes').textContent = state.minutes;
  $('finished').textContent = state.tasks.filter(t => t.done).length;
  renderTimer();
}

$('add').onsubmit = e => {
  e.preventDefault();
  const text = $('newTask').value.trim();
  if (!text) return;
  const t = { id: Date.now().toString(36), text, done: false, pomos: 0 };
  state.tasks.push(t);
  if (!state.selected) state.selected = t.id;
  $('newTask').value = '';
  save(); renderTasks();
};

// ---------- wiring ----------
$('start').onclick = () => endAt ? pause() : start();
$('reset').onclick = () => setMode(mode);
$('skip').onclick = () => finish(true);
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); $('start').click(); }
  if (e.key === 'r' || e.key === 'R') setMode(mode);
});

renderTasks();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
